name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project NBAWidget.xcodeproj \
            -target NBAWidget \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 80
          test -d build/Release-iphoneos/NBAWidget.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/NBAWidget.app Payload/
          ls Payload/NBAWidget.app/PlugIns
          zip -qry NBAWidget.ipa Payload

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NBA赛程 build ${{ github.run_number }}
          files: NBAWidget.ipa
