name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project NBAWidget.xcodeproj \
            -target NBAWidget \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 80
          test -d build/Release-iphoneos/NBAWidget.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/NBAWidget.app Payload/
          # 临时签名，只为把 App Group 权限写进包里，签名工具保留权限时可用
          codesign --force --sign - --entitlements Widget/NBAWidgetExtension.entitlements \
            Payload/NBAWidget.app/PlugIns/NBAWidgetExtension.appex
          codesign --force --sign - --entitlements App/NBAWidget.entitlements Payload/NBAWidget.app
          zip -qry NBAWidget.ipa Payload
          {
            echo '包内文件（排查用）：'
            echo '```'
            (cd Payload && find . -maxdepth 4 -not -name '*.png' | sort)
            echo '--- widget Info.plist ---'
            plutil -p Payload/NBAWidget.app/PlugIns/*.appex/Info.plist
            echo '```'
          } > notes.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NBA赛程 build ${{ github.run_number }}
          files: NBAWidget.ipa
          body_path: notes.md
