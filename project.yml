name: NBAWidget
options:
  bundleIdPrefix: com.hmb269
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NBAWidget:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 阿波
        CFBundleName: 阿波
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: 给血糖记录拍一张饮食照片
        NSBluetoothAlwaysUsageDescription: 通过蓝牙连接罗氏血糖仪，读取血糖记录
        NSHealthUpdateUsageDescription: 把血糖仪读到的血糖记录保存到健康 App
        NSHealthShareUsageDescription: 读取睡眠、体重、心率变异性和步数，显示在 App 和小组件里
        NSPhotoLibraryUsageDescription: 把你选的照片放进「阿波小组件」相簿，用作小组件图标
        NSPhotoLibraryAddUsageDescription: 把你选的照片放进「阿波小组件」相簿，用作小组件图标
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmb269.nbawidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NBAWidgetExtension
  NBAWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 阿波
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSHealthShareUsageDescription: 读取睡眠、体重、心率变异性和步数，显示在 App 和小组件里
        NSPhotoLibraryUsageDescription: 把你选的照片放进「阿波小组件」相簿，用作小组件图标
        NSPhotoLibraryAddUsageDescription: 把你选的照片放进「阿波小组件」相簿，用作小组件图标
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmb269.nbawidget.widget
